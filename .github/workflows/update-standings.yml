name: Sync ESPN Standings
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Debug secrets
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          echo "ESPN_S2 length: ${#ESPN_S2}"
          echo "ESPN_SWID length: ${#ESPN_SWID}"
      - name: Fetch ESPN standings
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/espn-sync.js
      - name: Commit updated data
        run: |
          git config user.name "espn-sync-bot"
          git config user.email "actions@github.com"
          git add data/standings.json
          git diff --quiet --cached || git commit -m "Sync ESPN standings"
          git push
