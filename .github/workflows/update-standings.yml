name: Sync ESPN Standings

on:
  schedule:
    # Every Tuesday at 09:00 UTC (after MNF settles) during football season.
    # Adjust as you like — cron uses UTC.
    - cron: "0 9 * * 2"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ESPN standings
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/espn-sync.js

      - name: Commit updated data
        run: |
          git config user.name "espn-sync-bot"
          git config user.email "actions@github.com"
          git add data/standings.json
          git diff --quiet --cached || git commit -m "Sync ESPN standings"
          git push
